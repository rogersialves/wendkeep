services:
  wendkeep-observer:
    build:
      context: ../..
      dockerfile: docker/wendkeep-observer/Dockerfile
    environment:
      WENDKEEP_OBSERVER_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - observer-data:/data
    restart: unless-stopped

volumes:
  observer-data:
