services:
  wendkeep-observer:
    build:
      context: ../..
      dockerfile: docker/wendkeep-observer/Dockerfile
    environment:
      WENDKEEP_OBSERVER_DATA_DIR: /data
      WENDKEEP_OBSERVER_TOKEN: "${WENDKEEP_OBSERVER_TOKEN:?set WENDKEEP_OBSERVER_TOKEN before starting Observer}"
      WENDKEEP_OBSERVER_BOOTSTRAP_TOKEN_ID: "${WENDKEEP_OBSERVER_BOOTSTRAP_TOKEN_ID:-observer-bootstrap}"
      WENDKEEP_OBSERVER_BOOTSTRAP_ROLE: "${WENDKEEP_OBSERVER_BOOTSTRAP_ROLE:-admin}"
      WENDKEEP_OBSERVER_BOOTSTRAP_PROJECTS: "${WENDKEEP_OBSERVER_BOOTSTRAP_PROJECTS:?set an explicit comma-separated project allowlist}"
      WENDKEEP_OBSERVER_BOOTSTRAP_SCOPES: "${WENDKEEP_OBSERVER_BOOTSTRAP_SCOPES:-*}"
      WENDKEEP_OBSERVER_BOOTSTRAP_EXPIRES_AT: "${WENDKEEP_OBSERVER_BOOTSTRAP_EXPIRES_AT:?set a finite ISO-8601 bootstrap expiry}"
      WENDKEEP_OBSERVER_ENCRYPTION_KEY: "${WENDKEEP_OBSERVER_ENCRYPTION_KEY:?set a 32-byte hex/base64 Observer encryption key}"
      WENDKEEP_OBSERVER_ENCRYPTION_KEY_ID: "${WENDKEEP_OBSERVER_ENCRYPTION_KEY_ID:-observer-local-v1}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - observer-data:/data
    restart: unless-stopped

volumes:
  observer-data:
