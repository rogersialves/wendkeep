name: test

on:
  pull_request:

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / linux-minimum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Validate minimum runtime
        run: node --test tests/runtime-compat.mjs

      - name: Validate syntax on minimum runtime
        run: npm run check

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0

      - run: npm ci --ignore-scripts

      - name: Run full Linux suite
        run: npm test
