name: test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: test / policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Validate evidence-based commit messages
        run: >-
          node scripts/validate-commit-range.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Validate CI, package and migration policies
        run: >-
          node --test
          tests/ci-policy.test.mjs
          tests/modular-package-boundaries.test.mjs
          tests/migration-harness.test.mjs
          tests/migration-sequential-upgrade.test.mjs
          tests/migration-crash-repair.test.mjs
      - run: npm run check

  core:
    name: test / core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Validate minimum runtime boundary
        run: node --test tests/runtime-compat.mjs
      - name: Run Core without Observer SQLite
        run: npm run test:core

  observer:
    name: test / observer (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.13.0 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22.13.0 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 22.13.0 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Run full Observer and SQLite surface
        run: npm run test:observer

  full:
    name: test / full
    needs: [policy, core, observer, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test

  quality:
    name: test / quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run quality:coverage
      - run: npm run quality:mutation
