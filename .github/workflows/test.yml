name: test

on:
  pull_request:

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / linux-minimum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Validate minimum runtime
        run: node --test tests/runtime-compat.mjs

      - name: Validate syntax on minimum runtime
        run: npm run check

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0

      - run: npm ci --ignore-scripts

      - name: Run full Linux suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-test-output-${{ github.sha }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1
