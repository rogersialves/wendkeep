name: reconcile-0.72.1-release

on:
  push:
    branches: [wk/reconcile-0-72-1-release]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag and published tarball
        run: |
          TAG=v0.72.1
          EXPECTED_COMMIT=12b21ed58e1ded58bfe7820980b5102d3e892872
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          test "$TAG_COMMIT" = "$EXPECTED_COMMIT"
          npm pack --dry-run --json > pack-output.txt
          LOCAL_INTEGRITY=$(node -e 'const fs=require("node:fs");const raw=fs.readFileSync("pack-output.txt","utf8");const start=raw.indexOf("[");const end=raw.lastIndexOf("]");process.stdout.write(JSON.parse(raw.slice(start,end+1))[0].integrity)')
          PUBLISHED_INTEGRITY=$(npm view wendkeep@0.72.1 dist.integrity --prefer-online)
          test "$LOCAL_INTEGRITY" = "$PUBLISHED_INTEGRITY"
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          echo "PUBLISHED_INTEGRITY=$PUBLISHED_INTEGRITY" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.72.1
          node scripts/print-release-notes.mjs 0.72.1 > RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
          gh release view "$TAG" --json body --jq .body > PUBLISHED_RELEASE_NOTES.md
          RELEASE_URL=$(gh release view "$TAG" --json url --jq .url)
          node -e 'const fs=require("node:fs");const norm=(path)=>fs.readFileSync(path,"utf8").replace(/\r\n/g,"\n").trimEnd();if(norm("RELEASE_NOTES.md")!==norm("PUBLISHED_RELEASE_NOTES.md"))throw new Error("GitHub Release diverge do CHANGELOG")'
          RECEIPT_RELEASE_URL="$RELEASE_URL" node -e 'const fs=require("node:fs");const receipt={ok:true,code:"verified",name:"wendkeep",version:"0.72.1",tag:"v0.72.1",commit:process.env.TAG_COMMIT,integrity:process.env.PUBLISHED_INTEGRITY,workflow_run:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,github_release:process.env.RECEIPT_RELEASE_URL};fs.writeFileSync("release-receipt.json",JSON.stringify(receipt,null,2)+"\n")'
      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-0.72.1
          path: release-receipt.json
          if-no-files-found: error
